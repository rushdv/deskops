name: DeskOps CI Pipeline

on:
  push:
    branches: [main, feat/*, feature/*]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Validate Foundation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deskops
          POSTGRES_PASSWORD: deskops_password
          POSTGRES_DB: deskops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Server Build & Tests
        env:
          DATABASE_URL: postgresql://deskops:deskops_password@localhost:5432/deskops_db?schema=public
          JWT_ACCESS_SECRET: ci_jwt_access_secret_for_tests_only
          JWT_REFRESH_SECRET: ci_jwt_refresh_secret_for_tests_only
        run: |
          cd server
          npm ci
          npx prisma db push --skip-generate
          npm run seed
          npm test
          npm run build

      - name: Validate Client Build
        run: |
          cd client
          npm ci
          npm run build

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
